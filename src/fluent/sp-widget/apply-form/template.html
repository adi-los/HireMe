<div class="panel panel-default">
  <div class="panel-body">

    <!-- Loading -->
    <div ng-if="c.view === 'loading'" class="text-center text-muted">
      <i class="fa fa-spinner fa-spin fa-2x"></i>
    </div>

    <!-- Position closed / not found -->
    <div ng-if="c.view === 'closed'" class="text-center">
      <i class="fa fa-exclamation-circle fa-2x text-warning"></i>
      <p class="m-t-sm" ng-repeat="err in c.serverErrors track by $index">{{err}}</p>
      <a class="btn btn-default m-t-sm" href="?id=x_winu_hireme_jobs">Back to Open Positions</a>
    </div>

    <!-- Application form -->
    <div ng-if="c.view === 'form'">
      <h3 class="panel-title m-b-md">Apply — {{c.data.jobTitle}}</h3>
      <p class="text-muted" ng-if="c.data.jobDepartment || c.data.jobLocation">
        <span ng-if="c.data.jobDepartment">{{c.data.jobDepartment}}</span>
        <span ng-if="c.data.jobDepartment && c.data.jobLocation"> &middot; </span>
        <span ng-if="c.data.jobLocation">{{c.data.jobLocation}}</span>
      </p>

      <div class="alert alert-danger" ng-if="c.serverErrors.length">
        <ul class="list-unstyled m-b-none">
          <li ng-repeat="err in c.serverErrors track by $index">{{err}}</li>
        </ul>
      </div>

      <form name="applyForm" ng-submit="c.submit()" novalidate>
        <div class="form-group">
          <label for="full_name">Full name <span class="text-danger">*</span></label>
          <input type="text" id="full_name" name="full_name" class="form-control"
                 ng-model="c.form.full_name" required maxlength="100" />
        </div>

        <div class="form-group">
          <label for="email">Email <span class="text-danger">*</span></label>
          <input type="email" id="email" name="email" class="form-control"
                 ng-model="c.form.email" required />
        </div>

        <div class="form-group">
          <label for="phone">Phone</label>
          <input type="tel" id="phone" name="phone" class="form-control"
                 ng-model="c.form.phone" maxlength="40" />
        </div>

        <div class="form-group">
          <label for="cv_file">CV / Resume</label>
          <input type="file" id="cv_file" name="cv_file" class="form-control"
                 accept=".pdf,.doc,.docx"
                 onchange="angular.element(this).scope().c.onFileChange(this.files[0])" />
          <span class="help-block" ng-if="c.fileName">Selected: {{c.fileName}}</span>
          <span class="help-block text-danger" ng-if="c.fileTooLarge">
            That file is too large (5MB max). Please choose a smaller file.
          </span>
        </div>

        <div class="checkbox">
          <label>
            <input type="checkbox" ng-model="c.form.consent" required />
            I consent to my data being processed for this application, per the privacy notice.
          </label>
        </div>

        <button type="submit" class="btn btn-primary"
                ng-disabled="c.submitting || applyForm.$invalid || !c.form.consent">
          <span ng-if="c.submitting"><i class="fa fa-spinner fa-spin"></i> Submitting…</span>
          <span ng-if="!c.submitting">Submit Application</span>
        </button>
      </form>
    </div>

    <!-- Success -->
    <div ng-if="c.view === 'success'" class="text-center">
      <i class="fa fa-check-circle fa-3x text-success"></i>
      <h4 class="m-t-sm">Application submitted</h4>
      <p>Thanks for applying — we'll be in touch.</p>
    </div>

  </div>
</div>
